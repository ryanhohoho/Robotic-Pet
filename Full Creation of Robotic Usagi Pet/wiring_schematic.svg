<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1060" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1500" height="1060" fill="#ffffff"/>
  <rect x="8" y="8" width="1484" height="1044" fill="none" stroke="#111" stroke-width="2"/>

  <!-- ===== title bar ===== -->
  <text x="28" y="46" font-size="26" font-weight="bold" fill="#111">Robotic Usagi Pet — Electrical Wiring Schematic</text>
  <text x="28" y="70" font-size="14" fill="#444">v2 hardware: 2S LiPo, N20 differential drive, painted face (no OLEDs). Raspberry Pi 3 B+. Pin numbers are BCM and match config.yaml.</text>
  <line x1="28" y1="82" x2="1472" y2="82" stroke="#111" stroke-width="1.2"/>

  <!-- ===== legend ===== -->
  <g font-size="12.5" fill="#111">
    <rect x="1070" y="96" width="402" height="96" fill="#fafafa" stroke="#999"/>
    <text x="1082" y="114" font-weight="bold">Wire legend</text>
    <line x1="1082" y1="130" x2="1114" y2="130" stroke="#c0392b" stroke-width="3.5"/><text x="1122" y="134">+7.4V motor rail (LiPo)</text>
    <line x1="1290" y1="130" x2="1322" y2="130" stroke="#e67e22" stroke-width="3.5"/><text x="1330" y="134">+5V (Pi)</text>
    <line x1="1082" y1="150" x2="1114" y2="150" stroke="#f1c40f" stroke-width="3.5"/><text x="1122" y="154">+3.3V logic ref</text>
    <line x1="1290" y1="150" x2="1322" y2="150" stroke="#111" stroke-width="3.5"/><text x="1330" y="154">GND</text>
    <line x1="1082" y1="170" x2="1114" y2="170" stroke="#2980b9" stroke-width="3.5"/><text x="1122" y="174">GPIO signal</text>
    <line x1="1290" y1="170" x2="1322" y2="170" stroke="#8e44ad" stroke-width="3.5"/><text x="1330" y="174">Motor output</text>
  </g>

  <!-- ================= POWER CHAIN (left) ================= -->
  <!-- battery -->
  <g>
    <rect x="40" y="130" width="150" height="86" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
    <text x="115" y="158" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">2S LiPo</text>
    <text x="115" y="178" font-size="12" text-anchor="middle" fill="#333">7.4V nom (8.4 max)</text>
    <text x="115" y="196" font-size="12" text-anchor="middle" fill="#333">1300–2200 mAh</text>
    <text x="60" y="212" font-size="11" fill="#c0392b">+</text>
    <text x="176" y="212" font-size="11" fill="#111">–</text>
  </g>

  <!-- inline fuse -->
  <g>
    <rect x="230" y="150" width="96" height="46" rx="6" fill="#fff8e1" stroke="#b8860b" stroke-width="1.6"/>
    <text x="278" y="170" font-size="12" text-anchor="middle" font-weight="bold">Fuse</text>
    <text x="278" y="187" font-size="11" text-anchor="middle">3 A slow</text>
  </g>

  <!-- main switch -->
  <g>
    <rect x="366" y="150" width="110" height="46" rx="6" fill="#eef2f7" stroke="#555" stroke-width="1.6"/>
    <text x="421" y="170" font-size="12" text-anchor="middle" font-weight="bold">Main switch</text>
    <text x="421" y="187" font-size="11" text-anchor="middle">SPST, &gt;=3A</text>
  </g>

  <!-- V+ node -->
  <circle cx="540" cy="173" r="5" fill="#c0392b"/>
  <text x="540" y="150" font-size="11" text-anchor="middle" fill="#c0392b">VBATT node</text>

  <!-- red run: battery + -> fuse -> switch -> node -->
  <line x1="60" y1="150" x2="60" y2="118" stroke="#c0392b" stroke-width="3.5"/>
  <line x1="60" y1="118" x2="278" y2="118" stroke="#c0392b" stroke-width="3.5"/>
  <line x1="278" y1="118" x2="278" y2="150" stroke="#c0392b" stroke-width="3.5"/>
  <line x1="278" y1="196" x2="278" y2="173" stroke="#c0392b" stroke-width="3.5"/>
  <line x1="278" y1="173" x2="366" y2="173" stroke="#c0392b" stroke-width="3.5"/>
  <line x1="476" y1="173" x2="540" y2="173" stroke="#c0392b" stroke-width="3.5"/>

  <!-- node splits: up to UBEC, down/right to TB6612 VM -->
  <!-- UBEC -->
  <g>
    <rect x="470" y="250" width="150" height="84" rx="6" fill="#fdf3e7" stroke="#e67e22" stroke-width="2"/>
    <text x="545" y="278" font-size="14" font-weight="bold" text-anchor="middle">UBEC</text>
    <text x="545" y="297" font-size="12" text-anchor="middle" fill="#333">5V / 3A switching</text>
    <text x="545" y="315" font-size="11" text-anchor="middle" fill="#333">IN 7.4V → OUT 5V</text>
  </g>
  <line x1="540" y1="173" x2="540" y2="250" stroke="#c0392b" stroke-width="3.5"/>

  <!-- ground symbol / rail -->
  <line x1="115" y1="216" x2="115" y2="1000" stroke="#111" stroke-width="3.5"/>
  <line x1="115" y1="1000" x2="1360" y2="1000" stroke="#111" stroke-width="3.5"/>
  <g stroke="#111" stroke-width="2">
    <line x1="700" y1="1000" x2="700" y2="1014"/>
    <line x1="686" y1="1014" x2="714" y2="1014"/>
    <line x1="691" y1="1020" x2="709" y2="1020"/>
    <line x1="696" y1="1026" x2="704" y2="1026"/>
  </g>
  <text x="726" y="1018" font-size="12" fill="#111">Common GND (star ground at battery negative)</text>

  <!-- ================= RASPBERRY PI (center) ================= -->
  <g>
    <rect x="470" y="380" width="250" height="470" rx="8" fill="#f4f7f2" stroke="#2e7d32" stroke-width="2.2"/>
    <text x="595" y="408" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">Raspberry Pi 3 B+</text>
    <text x="595" y="428" font-size="11.5" text-anchor="middle" fill="#555">40-pin GPIO header (BCM)</text>

    <!-- pin stubs on right edge -->
    <g font-size="12" fill="#111">
      <!-- power in -->
      <rect x="450" y="446" width="20" height="16" fill="#e67e22"/><text x="482" y="459">5V   (pin 2)</text>
      <rect x="450" y="470" width="20" height="16" fill="#111"/><text x="482" y="483" fill="#111">GND  (pin 6)</text>
      <rect x="450" y="494" width="20" height="16" fill="#f1c40f"/><text x="482" y="507">3V3  (pin 1)</text>

      <!-- i2c -->
      <rect x="450" y="524" width="20" height="16" fill="#2980b9"/><text x="482" y="537">GPIO2  SDA (pin 3)</text>
      <rect x="450" y="548" width="20" height="16" fill="#2980b9"/><text x="482" y="561">GPIO3  SCL (pin 5)</text>

      <!-- motor control -->
      <rect x="450" y="586" width="20" height="16" fill="#2980b9"/><text x="482" y="599">GPIO17 AIN1 (pin 11)</text>
      <rect x="450" y="610" width="20" height="16" fill="#2980b9"/><text x="482" y="623">GPIO27 AIN2 (pin 13)</text>
      <rect x="450" y="634" width="20" height="16" fill="#2980b9"/><text x="482" y="647">GPIO12 PWMA (pin 32)</text>
      <rect x="450" y="662" width="20" height="16" fill="#2980b9"/><text x="482" y="675">GPIO23 BIN1 (pin 16)</text>
      <rect x="450" y="686" width="20" height="16" fill="#2980b9"/><text x="482" y="699">GPIO24 BIN2 (pin 18)</text>
      <rect x="450" y="710" width="20" height="16" fill="#2980b9"/><text x="482" y="723">GPIO13 PWMB (pin 33)</text>
      <rect x="450" y="734" width="20" height="16" fill="#2980b9"/><text x="482" y="747">GPIO25 STBY (pin 22)</text>

      <!-- csi + usb -->
      <rect x="450" y="772" width="20" height="16" fill="#16a085"/><text x="482" y="785">CSI-2 camera port</text>
      <rect x="450" y="796" width="20" height="16" fill="#16a085"/><text x="482" y="809">USB 2.0 (mic)</text>
      <text x="482" y="833" font-size="10.5" fill="#777">GND also via pins 9,14,20,25,30,34,39</text>
    </g>
  </g>

  <!-- 5V from UBEC into Pi 5V -->
  <line x1="545" y1="334" x2="545" y2="360" stroke="#e67e22" stroke-width="3.5"/>
  <line x1="545" y1="360" x2="360" y2="360" stroke="#e67e22" stroke-width="3.5"/>
  <line x1="360" y1="360" x2="360" y2="454" stroke="#e67e22" stroke-width="3.5"/>
  <line x1="360" y1="454" x2="450" y2="454" stroke="#e67e22" stroke-width="3.5"/>
  <text x="366" y="352" font-size="10.5" fill="#e67e22">5V rail to Pi (separate from motors)</text>

  <!-- Pi GND to rail -->
  <line x1="450" y1="478" x2="330" y2="478" stroke="#111" stroke-width="3"/>
  <line x1="330" y1="478" x2="330" y2="900" stroke="#111" stroke-width="3"/>
  <line x1="330" y1="900" x2="115" y2="900" stroke="#111" stroke-width="3"/>

  <!-- UBEC GND to rail -->
  <line x1="500" y1="334" x2="500" y2="352" stroke="#111" stroke-width="2.4"/>
  <line x1="500" y1="352" x2="300" y2="352" stroke="#111" stroke-width="2.4"/>
  <line x1="300" y1="352" x2="300" y2="500" stroke="#111" stroke-width="2.4"/>
  <line x1="300" y1="500" x2="115" y2="500" stroke="#111" stroke-width="2.4"/>

  <!-- ================= TB6612FNG (right) ================= -->
  <g>
    <rect x="900" y="520" width="230" height="300" rx="8" fill="#eef4fb" stroke="#2980b9" stroke-width="2.2"/>
    <text x="1015" y="548" font-size="16" font-weight="bold" text-anchor="middle" fill="#111">TB6612FNG</text>
    <text x="1015" y="566" font-size="11" text-anchor="middle" fill="#555">dual H-bridge motor driver</text>

    <g font-size="12" fill="#111">
      <!-- left-side control inputs -->
      <rect x="880" y="586" width="20" height="14" fill="#2980b9"/><text x="908" y="597" text-anchor="start">AIN1</text>
      <rect x="880" y="606" width="20" height="14" fill="#2980b9"/><text x="908" y="617">AIN2</text>
      <rect x="880" y="626" width="20" height="14" fill="#2980b9"/><text x="908" y="637">PWMA</text>
      <rect x="880" y="652" width="20" height="14" fill="#2980b9"/><text x="908" y="663">BIN1</text>
      <rect x="880" y="672" width="20" height="14" fill="#2980b9"/><text x="908" y="683">BIN2</text>
      <rect x="880" y="692" width="20" height="14" fill="#2980b9"/><text x="908" y="703">PWMB</text>
      <rect x="880" y="718" width="20" height="14" fill="#2980b9"/><text x="908" y="729">STBY</text>
      <rect x="880" y="744" width="20" height="14" fill="#f1c40f"/><text x="908" y="755">VCC (logic 3.3V)</text>
      <rect x="880" y="768" width="20" height="14" fill="#111"/><text x="908" y="779">GND</text>
      <rect x="880" y="792" width="20" height="14" fill="#c0392b"/><text x="908" y="803">VM (motor 7.4V)</text>

      <!-- right-side outputs -->
      <rect x="1130" y="600" width="20" height="14" fill="#8e44ad"/><text x="1124" y="611" text-anchor="end">AO1</text>
      <rect x="1130" y="624" width="20" height="14" fill="#8e44ad"/><text x="1124" y="635" text-anchor="end">AO2</text>
      <rect x="1130" y="690" width="20" height="14" fill="#8e44ad"/><text x="1124" y="701" text-anchor="end">BO1</text>
      <rect x="1130" y="714" width="20" height="14" fill="#8e44ad"/><text x="1124" y="725" text-anchor="end">BO2</text>
    </g>
  </g>

  <!-- Pi control signals to TB6612 (bus) -->
  <g stroke="#2980b9" stroke-width="2.4" fill="none">
    <path d="M470 594 H 820 V 593 H 880"/>
    <path d="M470 618 H 810 V 613 H 880"/>
    <path d="M470 642 H 800 V 633 H 880"/>
    <path d="M470 670 H 800 V 659 H 880"/>
    <path d="M470 694 H 810 V 679 H 880"/>
    <path d="M470 718 H 820 V 699 H 880"/>
    <path d="M470 742 H 830 V 725 H 880"/>
  </g>
  <text x="770" y="588" font-size="10.5" fill="#2980b9">7 control lines (AIN1/2, PWMA, BIN1/2, PWMB, STBY)</text>

  <!-- TB6612 VCC logic ref from Pi 3V3 -->
  <line x1="470" y1="502" x2="850" y2="502" stroke="#f1c40f" stroke-width="2.6"/>
  <line x1="850" y1="502" x2="850" y2="751" stroke="#f1c40f" stroke-width="2.6"/>
  <line x1="850" y1="751" x2="880" y2="751" stroke="#f1c40f" stroke-width="2.6"/>

  <!-- TB6612 VM from VBATT node -->
  <line x1="540" y1="173" x2="1200" y2="173" stroke="#c0392b" stroke-width="3.5"/>
  <line x1="1200" y1="173" x2="1200" y2="799" stroke="#c0392b" stroke-width="3.5"/>
  <line x1="1200" y1="799" x2="900" y2="799" stroke="#c0392b" stroke-width="3.5"/>
  <text x="1206" y="480" font-size="10.5" fill="#c0392b" transform="rotate(90 1206 480)">motor rail direct from battery</text>

  <!-- TB6612 GND to rail -->
  <line x1="900" y1="775" x2="870" y2="775" stroke="#111" stroke-width="2.6"/>
  <line x1="870" y1="775" x2="870" y2="940" stroke="#111" stroke-width="2.6"/>
  <line x1="870" y1="940" x2="115" y2="940" stroke="#111" stroke-width="2.6"/>

  <!-- ================= MOTORS ================= -->
  <g>
    <rect x="1240" y="586" width="130" height="70" rx="6" fill="#f6eefb" stroke="#8e44ad" stroke-width="2"/>
    <text x="1305" y="612" font-size="13" font-weight="bold" text-anchor="middle">Left N20</text>
    <text x="1305" y="630" font-size="11" text-anchor="middle" fill="#333">6V gearmotor</text>
    <text x="1305" y="646" font-size="11" text-anchor="middle" fill="#333">34×7 wheel</text>
  </g>
  <g>
    <rect x="1240" y="676" width="130" height="70" rx="6" fill="#f6eefb" stroke="#8e44ad" stroke-width="2"/>
    <text x="1305" y="702" font-size="13" font-weight="bold" text-anchor="middle">Right N20</text>
    <text x="1305" y="720" font-size="11" text-anchor="middle" fill="#333">6V gearmotor</text>
    <text x="1305" y="736" font-size="11" text-anchor="middle" fill="#333">34×7 wheel</text>
  </g>
  <line x1="1150" y1="607" x2="1240" y2="607" stroke="#8e44ad" stroke-width="2.6"/>
  <line x1="1150" y1="631" x2="1210" y2="631" stroke="#8e44ad" stroke-width="2.6"/>
  <line x1="1210" y1="631" x2="1210" y2="640" stroke="#8e44ad" stroke-width="2.6"/><line x1="1210" y1="640" x2="1240" y2="640" stroke="#8e44ad" stroke-width="2.6"/>
  <line x1="1150" y1="697" x2="1240" y2="697" stroke="#8e44ad" stroke-width="2.6"/>
  <line x1="1150" y1="721" x2="1210" y2="721" stroke="#8e44ad" stroke-width="2.6"/>
  <line x1="1210" y1="721" x2="1210" y2="712" stroke="#8e44ad" stroke-width="2.6"/><line x1="1210" y1="712" x2="1240" y2="712" stroke="#8e44ad" stroke-width="2.6"/>

  <!-- ================= MPU6050 ================= -->
  <g>
    <rect x="900" y="250" width="180" height="120" rx="6" fill="#eef4fb" stroke="#2980b9" stroke-width="2"/>
    <text x="990" y="276" font-size="14" font-weight="bold" text-anchor="middle">MPU6050 IMU</text>
    <text x="990" y="294" font-size="10.5" text-anchor="middle" fill="#555">I2C 0x68 · optional</text>
    <g font-size="11.5" fill="#111">
      <rect x="880" y="306" width="18" height="13" fill="#f1c40f"/><text x="906" y="317">VCC 3.3V</text>
      <rect x="880" y="324" width="18" height="13" fill="#111"/><text x="906" y="335">GND</text>
      <rect x="880" y="342" width="18" height="13" fill="#2980b9"/><text x="906" y="353">SDA</text>
      <rect x="1062" y="342" width="18" height="13" fill="#2980b9"/><text x="1056" y="353" text-anchor="end">SCL</text>
    </g>
  </g>
  <!-- i2c from Pi -->
  <line x1="470" y1="532" x2="760" y2="532" stroke="#2980b9" stroke-width="2.2"/>
  <line x1="760" y1="532" x2="760" y2="348" stroke="#2980b9" stroke-width="2.2"/>
  <line x1="760" y1="348" x2="880" y2="348" stroke="#2980b9" stroke-width="2.2"/>
  <line x1="470" y1="556" x2="740" y2="556" stroke="#2980b9" stroke-width="2.2"/>
  <line x1="740" y1="556" x2="740" y2="368" stroke="#2980b9" stroke-width="2.2"/>
  <line x1="740" y1="368" x2="1090" y2="368" stroke="#2980b9" stroke-width="2.2"/>
  <line x1="1090" y1="368" x2="1090" y2="348" stroke="#2980b9" stroke-width="2.2"/>
  <line x1="1090" y1="348" x2="1080" y2="348" stroke="#2980b9" stroke-width="2.2"/>
  <!-- mpu power + gnd -->
  <line x1="880" y1="312" x2="820" y2="312" stroke="#f1c40f" stroke-width="2.2"/>
  <line x1="820" y1="312" x2="820" y2="502" stroke="#f1c40f" stroke-width="2.2"/>
  <line x1="880" y1="330" x2="800" y2="330" stroke="#111" stroke-width="2.2"/>
  <line x1="800" y1="330" x2="800" y2="960" stroke="#111" stroke-width="2.2"/>
  <line x1="800" y1="960" x2="115" y2="960" stroke="#111" stroke-width="2.2"/>

  <!-- ================= CAMERA + MIC ================= -->
  <g>
    <rect x="150" y="600" width="200" height="80" rx="6" fill="#e8f6f0" stroke="#16a085" stroke-width="2"/>
    <text x="250" y="626" font-size="13.5" font-weight="bold" text-anchor="middle">Camera (CSI)</text>
    <text x="250" y="645" font-size="10.5" text-anchor="middle" fill="#333">Pi Cam Module 3, or</text>
    <text x="250" y="661" font-size="10.5" text-anchor="middle" fill="#333">OV5647 clone (budget)</text>
  </g>
  <line x1="350" y1="782" x2="410" y2="782" stroke="#16a085" stroke-width="2.6"/>
  <line x1="410" y1="782" x2="410" y2="640" stroke="#16a085" stroke-width="2.6"/>
  <line x1="410" y1="640" x2="450" y2="640" stroke="#16a085" stroke-width="0"/>
  <line x1="350" y1="640" x2="410" y2="640" stroke="#16a085" stroke-width="2.6"/>
  <text x="356" y="700" font-size="10" fill="#16a085">15-pin CSI ribbon</text>

  <g>
    <rect x="150" y="710" width="200" height="70" rx="6" fill="#e8f6f0" stroke="#16a085" stroke-width="2"/>
    <text x="250" y="736" font-size="13.5" font-weight="bold" text-anchor="middle">USB microphone</text>
    <text x="250" y="755" font-size="10.5" text-anchor="middle" fill="#333">mini USB mic module</text>
  </g>
  <line x1="350" y1="806" x2="450" y2="806" stroke="#16a085" stroke-width="2.6"/>

  <!-- ================= NOTES ================= -->
  <g font-size="12" fill="#111">
    <rect x="40" y="820" width="240" height="150" fill="#fbfbf5" stroke="#999"/>
    <text x="52" y="840" font-weight="bold">Build notes</text>
    <text x="52" y="860">1. Star-ground at battery negative;</text>
    <text x="64" y="875">Pi and motor grounds meet there only.</text>
    <text x="52" y="893">2. Motor rail (VM) is battery-direct;</text>
    <text x="64" y="908">Pi runs off the UBEC 5V rail.</text>
    <text x="52" y="926">3. TB6612 VCC = 3.3V logic reference.</text>
    <text x="52" y="944">4. Add 470–1000µF across VM/GND at</text>
    <text x="64" y="959">the TB6612 to absorb motor spikes.</text>
  </g>

  <!-- ================= TITLE BLOCK ================= -->
  <g font-size="12" fill="#111">
    <rect x="1090" y="900" width="382" height="118" fill="#ffffff" stroke="#111" stroke-width="1.4"/>
    <line x1="1090" y1="936" x2="1472" y2="936" stroke="#111"/>
    <line x1="1090" y1="972" x2="1472" y2="972" stroke="#111"/>
    <line x1="1300" y1="900" x2="1300" y2="1018" stroke="#111"/>
    <text x="1102" y="922" font-weight="bold" font-size="13">Robotic Usagi Pet</text>
    <text x="1312" y="922">Sheet 1 / 1</text>
    <text x="1102" y="958">Wiring &amp; power distribution</text>
    <text x="1312" y="958">Rev. B</text>
    <text x="1102" y="994">Drawn: Cowork</text>
    <text x="1312" y="994">2026-07-06</text>
    <text x="1102" y="1012" font-size="10" fill="#666">Pi 3 B+ · TB6612FNG · 2×N20 · 2S LiPo</text>
  </g>
</svg>
